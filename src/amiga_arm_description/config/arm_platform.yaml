# Arm platform geometry. All values in metres / radians.
# Frames: X forward, Y left, Z up. platform_link: X points from the top plank towards
# the vertical plank. Its origin is the top edge of the cross tube the vertical plank
# hangs against, centred in Y.

platform:
  # Pose of platform_link relative to the Amiga base_link (centre of the wheel axles,
  # at axle height; see the amiga_description package).
  # Current mount: on the rear cross tube, turned 180 deg (vertical plank against the
  # tube's rear face, top plank towards the front of the Amiga).
  # Estimate from the amiga_description dimensions: rear cross tube centred at x -0.394,
  # 0.040 thick, top at z 0.435. Measure on the robot and update.
  xyz: [-0.414, 0.0, 0.435]
  rpy: [0.0, 0.0, 3.1416]
  # Not turned (vertical plank against the tube's front face):
  # xyz: [-0.374, 0.0, 0.435]
  # rpy: [0.0, 0.0, 0.0]
  plank: {length: 0.575, width: 0.190, thickness: 0.025}

arm:
  # Lite 6 link_base relative to platform_link.
  # Current mount: upright on the middle of the top plank, cable ports towards the
  # vertical plank (mount angle 0 in UFactory Studio). Yaw 0.0 = cable ports away from it.
  xyz: [-0.07, 0.0, 0.025]
  rpy: [0.0, 0.0, 3.1416]

camera:
  # OAK-D-W-PoE (camera:=true), its depthai base frame (on the front face, at the colour lens)
  # relative to base_link. Current mount: on a short tube clamped to the front cross tube and
  # pointing forward, centred in Y, hanging under the tube's end and looking straight down, image
  # top towards the front. Estimate from docs/images/overview-camera-side.jpg and the
  # amiga_description dimensions (front cross tube centred at x 0.394, bottom at z 0.395):
  # about 0.15 m in front of the cross tube, front face about 0.08 m below it. Measure and update.
  model: OAK-D-POE  # depthai_descriptions model: the W-PoE has the same housing
  xyz: [0.544, 0.0, 0.315]
  rpy: [0.0, 1.5708, 0.0]
  # The short tube the camera hangs under (drawn only, no collision): centre and size of a box
  # relative to base_link, under the front cross tube and running forward past the camera.
  tube: {xyz: [0.479, 0.0, 0.375], size: [0.21, 0.04, 0.04]}

# Simulation only, sideways:=true: the platform not turned (vertical plank against the rear
# cross tube's front face) and the arm on the vertical plank's front face, base axis along +X:
# it points forward, towards the front cross tube, and reaches the soil between the axles.
# `platform` here replaces the pose of the platform above.
arm_sideways:
  platform: {xyz: [-0.374, 0.0, 0.435], rpy: [0.0, 0.0, 0.0]}
  xyz: [0.025, 0.0, -0.095]
  rpy: [0.0, 1.5708, 0.0]

# Simulation option, robot:=xarm6: an xArm 6 (5 kg payload) in the Lite 6 places. Like the Lite 6,
# it reaches the soil only sideways (with the gripper; upright the base sits too high).
xarm6:
  xyz: [-0.07, 0.0, 0.025]
  rpy: [0.0, 0.0, 3.1416]
xarm6_sideways:
  platform: {xyz: [-0.374, 0.0, 0.435], rpy: [0.0, 0.0, 0.0]}
  xyz: [0.025, 0.0, -0.095]
  rpy: [0.0, 1.5708, 0.0]
