# Arm platform geometry. All values in metres / radians.
# Frames: X forward (Amiga driving direction), Y left, Z up.
# platform_link origin: top front edge of the Amiga back rail, centred in Y.

platform:
  # Pose of platform_link relative to its parent: the floor ("world") when
  # used standalone, the Amiga base_link once mounted in the Amiga model.
  # z 0.503 = rail top in the Amiga URDF (ground_clearance + wheel_radius + chassis_height).
  xyz: [0.0, 0.0, 0.503]
  rpy: [0.0, 0.0, 0.0]
  plank: {length: 0.575, width: 0.190, thickness: 0.025}

arm:
  # Lite 6 link_base relative to platform_link.
  # Current mount: centre of the vertical plank's front face, base axis along +X, cable ports up.
  xyz: [0.025, 0.0, -0.095]
  rpy: [0.0, 1.5708, 0.0]
  # Upright on the top plank instead (also set the mount angle in UFactory Studio to 0):
  # xyz: [-0.07, 0.0, 0.025]
  # rpy: [0.0, 0.0, 0.0]
